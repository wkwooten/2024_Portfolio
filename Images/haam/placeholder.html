<!DOCTYPE html>
<html>
<head>
    <title>Haam Placeholder Image</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            color: white;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 2rem;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255,255,255,0.2);
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            margin: 0.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🏛️</div>
        <h1>HAAM</h1>
        <p>Comprehensive Congress Tracking App</p>
        <div>
            <span class="badge">UX Design</span>
            <span class="badge">In Progress</span>
            <span class="badge">Political Transparency</span>
        </div>
    </div>
</body>
</html>

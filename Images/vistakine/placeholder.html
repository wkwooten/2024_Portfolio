<!DOCTYPE html>
<html>
<head>
    <title>vistaKine Placeholder Image</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            color: white;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 2rem;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255,255,255,0.2);
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            margin: 0.5rem;
            font-weight: bold;
        }
        .shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }
        .shape {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 30%;
            background: white;
        }
        .shape:nth-child(1) {
            top: 20%;
            left: 30%;
        }
        .shape:nth-child(2) {
            top: 60%;
            left: 70%;
            width: 120px;
            height: 120px;
        }
        .shape:nth-child(3) {
            top: 30%;
            left: 80%;
            width: 100px;
            height: 100px;
        }
        .shape:nth-child(4) {
            top: 70%;
            left: 20%;
            width: 60px;
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="container">
        <div class="icon">🔬</div>
        <h1>vistaKine</h1>
        <p>Interactive 3D Physics Textbook</p>
        <div>
            <span class="badge">Educational</span>
            <span class="badge">3D Interactive</span>
            <span class="badge">Physics</span>
        </div>
    </div>
</body>
</html>

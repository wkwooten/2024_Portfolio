<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Polyhedron Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #polyhedron-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: -1;
    }

    .overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 5px;
      max-width: 400px;
    }

    h1 {
      margin-top: 0;
    }

    .instructions {
      margin-bottom: 10px;
    }

    .performance-info {
      font-size: 0.8em;
      opacity: 0.8;
    }

    .controls {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }

    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:hover {
      background-color: #0d5bcd;
    }

    .debug-toggle {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    .debug-toggle input {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="polyhedron-container"></div>

  <div class="overlay">
    <h1>Interactive Polyhedron</h1>
    <div class="instructions">
      <p>Click and drag the polyhedron to move it around.</p>
      <p>Release to throw it and watch it bounce off the invisible walls.</p>
    </div>
    <div class="performance-info">
      <p>This demo uses Three.js for rendering and Cannon.js for physics.</p>
      <p>Performance metrics: <span id="fps">-- FPS</span></p>
    </div>
    <div class="controls">
      <button id="reset-polyhedron">Reset Position</button>
      <button id="change-color">Change Color</button>
      <button id="toggle-wireframe">Toggle Wireframe</button>
      <button id="toggle-boundaries">Show Boundaries</button>
      <div class="debug-toggle">
        <input type="checkbox" id="debug-mode">
        <label for="debug-mode">Debug Mode (console logs)</label>
      </div>
    </div>
  </div>

  <!-- Import dependencies -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>

  <!-- Import our polyhedron script -->
  <script type="module">
    import InteractivePolyhedron from './polyhedron.js';

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM loaded, initializing polyhedron...');
      const container = document.querySelector('#polyhedron-container');

      if (container) {
        console.log('Container found:', container);
        try {
          // Clear any existing canvas elements to prevent duplicates
          while (container.firstChild) {
            container.removeChild(container.firstChild);
          }
          console.log('Container cleared');

          // Enable debug mode by default to help troubleshoot
          const debugMode = true;
          console.log('Debug mode enabled by default');

          // Create the polyhedron
          console.log('Creating polyhedron instance...');
          const polyhedron = new InteractivePolyhedron(container);
          console.log('Polyhedron initialized successfully');

          // Set debug mode
          polyhedron.debug = debugMode;

          // Force debug checkbox to be checked
          const debugCheckbox = document.getElementById('debug-mode');
          if (debugCheckbox) {
            debugCheckbox.checked = debugMode;
          }

          // Add controls functionality
          const resetButton = document.getElementById('reset-polyhedron');
          if (resetButton) {
            resetButton.addEventListener('click', () => {
              console.log('Reset button clicked');
              // Reset position to center
              polyhedron.polyhedronBody.position.set(0, 0, 0);

              // Reset velocity with stable values
              polyhedron.polyhedronBody.velocity.set(0, 1.5, 0);

              // Reset angular velocity with reduced values
              polyhedron.polyhedronBody.angularVelocity.set(
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5
              );

              // Wake up the body if it was sleeping
              polyhedron.polyhedronBody.wakeUp();

              // Log reset for debugging
              console.log('Polyhedron position reset');
            });
          } else {
            console.error('Reset button not found');
          }

          // Color change button
          const colorButton = document.getElementById('change-color');
          if (colorButton) {
            colorButton.addEventListener('click', () => {
              console.log('Color change button clicked');
              const randomColor = Math.floor(Math.random() * 0xffffff);
              polyhedron.polyhedron.material.color.setHex(randomColor);

              // Also update the edges color if they exist
              if (polyhedron.polyhedron.children.length > 0) {
                polyhedron.polyhedron.children[0].material.color.setHex(randomColor);
              }

              console.log('Color changed to:', randomColor.toString(16));
            });
          } else {
            console.error('Color button not found');
          }

          // Wireframe toggle button
          const wireframeButton = document.getElementById('toggle-wireframe');
          if (wireframeButton) {
            let isWireframe = true; // Start with wireframe mode

            wireframeButton.addEventListener('click', () => {
              console.log('Wireframe toggle button clicked');
              isWireframe = !isWireframe;

              try {
                // Remove existing polyhedron
                polyhedron.scene.remove(polyhedron.polyhedron);

                // Create new geometry
                const radius = 1;
                const detail = 0;
                const geometry = new THREE.DodecahedronGeometry(radius, detail);

                // Get current color
                const currentColor = polyhedron.polyhedron.material.color.getHex();
                console.log('Current color:', currentColor.toString(16));

                let material;
                if (isWireframe) {
                  // Wireframe material
                  material = new THREE.MeshBasicMaterial({
                    color: currentColor,
                    wireframe: true,
                    wireframeLinewidth: 2
                  });

                  // Create edges
                  const edgesGeometry = new THREE.EdgesGeometry(geometry);
                  const edgesMaterial = new THREE.LineBasicMaterial({
                    color: currentColor,
                    linewidth: 2
                  });
                  const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);

                  // Create mesh
                  polyhedron.polyhedron = new THREE.Mesh(geometry, material);
                  polyhedron.polyhedron.add(edges);

                  wireframeButton.textContent = "Switch to Solid";
                  console.log('Switched to wireframe mode');
                } else {
                  // Solid material with reflections
                  material = new THREE.MeshPhysicalMaterial({
                    color: currentColor,
                    metalness: 0.5,
                    roughness: 0.2,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.1,
                    reflectivity: 1,
                    envMapIntensity: 1.0,
                    ior: 1.5
                  });

                  // Create mesh
                  polyhedron.polyhedron = new THREE.Mesh(geometry, material);

                  wireframeButton.textContent = "Switch to Wireframe";
                  console.log('Switched to solid mode');
                }

                // Add to scene and scale
                polyhedron.scene.add(polyhedron.polyhedron);
                polyhedron.polyhedron.scale.set(1.2, 1.2, 1.2);
                console.log('New polyhedron added to scene');

                // Make sure the physics body is still connected to the new mesh
                if (polyhedron.polyhedronBody) {
                  // Update the mesh position from the physics body
                  polyhedron.polyhedron.position.copy(polyhedron.polyhedronBody.position);
                  polyhedron.polyhedron.quaternion.copy(polyhedron.polyhedronBody.quaternion);
                  console.log('Updated mesh position from physics body');
                } else {
                  console.error('Physics body is undefined after toggling wireframe');
                }
              } catch (error) {
                console.error('Error toggling wireframe:', error);
              }
            });
          } else {
            console.error('Wireframe button not found');
          }

          // Debug mode toggle
          const debugToggle = document.getElementById('debug-mode');
          if (debugToggle) {
            debugToggle.addEventListener('change', (e) => {
              polyhedron.debug = e.target.checked;
              console.log('Debug mode:', polyhedron.debug ? 'enabled' : 'disabled');
            });
          } else {
            console.error('Debug toggle not found');
          }

          // Boundary toggle
          const boundaryButton = document.getElementById('toggle-boundaries');
          if (boundaryButton) {
            let boundariesVisible = true; // Start with boundaries visible

            boundaryButton.addEventListener('click', () => {
              boundariesVisible = !boundariesVisible;

              if (polyhedron.boundaryMeshes) {
                polyhedron.boundaryMeshes.forEach(item => {
                  item.mesh.visible = boundariesVisible;
                });
              }

              boundaryButton.textContent = boundariesVisible ? "Hide Boundaries" : "Show Boundaries";
            });

            // Set initial button text
            boundaryButton.textContent = "Hide Boundaries";
          } else {
            console.error('Boundary button not found');
          }

          // Simple FPS counter
          let frameCount = 0;
          let lastTime = performance.now();
          const fpsElement = document.getElementById('fps');

          if (fpsElement) {
            function updateFPS() {
              frameCount++;
              const now = performance.now();
              if (now - lastTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (now - lastTime));
                fpsElement.textContent = `${fps} FPS`;
                frameCount = 0;
                lastTime = now;
              }
              requestAnimationFrame(updateFPS);
            }

            updateFPS();
          } else {
            console.error('FPS element not found');
          }

          // Add a click handler to the container to help with mobile devices
          container.addEventListener('click', (event) => {
            // This empty click handler helps ensure touch events work properly on some mobile devices
            console.log('Container clicked');
          });

        } catch (error) {
          console.error('Error initializing polyhedron:', error);
        }
      } else {
        console.error('Polyhedron container not found!');
      }
    });
  </script>
</body>
</html>
